name: Build Chinese htop

# 手动触发。在 GitHub 云上把 htop 源码的界面字符串替换成中文后，
# 用官方 termux-packages 环境编译出 aarch64 的 .deb（手机上零安装）。
# 装法：gh run download 拿 .deb → dpkg -i → apt-mark hold htop（防英文版覆盖）。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repo (translation table)
        uses: actions/checkout@v4
        with:
          path: zh

      - name: Checkout termux-packages (htop recipe)
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: tp

      - name: Translate source and generate patch
        run: |
          set -e
          VER=$(grep -oP 'TERMUX_PKG_VERSION="\K[^"]+' tp/packages/htop/build.sh | head -1)
          SRCURL=$(grep -oP 'TERMUX_PKG_SRCURL=\K.*' tp/packages/htop/build.sh | head -1 | tr -d '"')
          SRCURL=${SRCURL//\$\{TERMUX_PKG_VERSION\}/$VER}
          echo "htop version: $VER"
          echo "source url:   $SRCURL"
          curl -sL "$SRCURL" -o htop-src.tar.gz
          mkdir pristine work
          tar -xzf htop-src.tar.gz -C pristine --strip-components=1
          tar -xzf htop-src.tar.gz -C work --strip-components=1
          python3 zh/tools/htop-zh/translate_htop.py zh/tools/htop-zh/htop_zh_CN.txt work
          # Bar-mode meter captions reserve 3 columns/bytes ("Mem"). Widen the
          # reservation to 4 columns and draw the full UTF-8 caption, so CJK
          # captions like 内存 are not cut mid-character.
          sed -i 's/int captionLen = 3;/int captionLen = 4;/' work/Meter.c
          sed -i 's/mvaddnstr(y, x, caption, captionLen);/mvaddnstr(y, x, caption, strlen(caption));/' work/Meter.c
          # Function bar layout advances by strlen() (bytes): each CJK label
          # wastes 2 columns and the bar overflows the screen (F9/F10 pushed
          # off). Advance by UTF-8 display width instead: (bytes + chars) / 2.
          sed -i 's|#include "FunctionBar.h"|#include "FunctionBar.h"\n#include <stdlib.h>|' work/FunctionBar.c
          sed -i 's|x += strlen(this->keys.constKeys\[i\]);|x += ((int)strlen(this->keys.constKeys[i]) + (int)mbstowcs(NULL, this->keys.constKeys[i], 0)) / 2;|' work/FunctionBar.c
          sed -i 's|x += strlen(this->functions\[i\]);|x += ((int)strlen(this->functions[i]) + (int)mbstowcs(NULL, this->functions[i], 0)) / 2;|' work/FunctionBar.c
          sed -i 's|x += strlen(buffer);|x += ((int)strlen(buffer) + (int)mbstowcs(NULL, buffer, 0)) / 2;|' work/FunctionBar.c
          sed -i 's|currentLen += strlen(buffer) + 1;|currentLen += ((int)strlen(buffer) + (int)mbstowcs(NULL, buffer, 0)) / 2 + 1;|' work/FunctionBar.c
          # -p1 patch: strip the pristine/work/ prefix components
          diff -ruN pristine work > zh-ui.patch || true
          test -s zh-ui.patch
          cp zh-ui.patch tp/packages/htop/0002-chinese-ui.patch
          echo "--- patch preview ---"
          head -40 zh-ui.patch

      - name: Build package (official Termux docker env)
        run: |
          set -e
          cd tp
          # -I: install prebuilt dependencies instead of building them. Building
          # ncurses from source drags in terminfo sources from codeberg.org etc.,
          # which the GitHub runners cannot always resolve. Only htop itself needs
          # building - it is the thing we patch.
          ./scripts/run-docker.sh ./build-package.sh -I -a aarch64 htop

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: htop-zh-aarch64
          path: tp/output/*.deb
          if-no-files-found: error
