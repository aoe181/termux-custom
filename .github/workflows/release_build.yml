name: Build Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Extract version
        id: version
        run: |
          VERSION_CODE=$(grep -m 1 -E '^\s+versionCode ' app/build.gradle | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -m 1 -E '^\s+versionName ' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          SHA7="${GITHUB_SHA::7}"
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=${VERSION_NAME}+${SHA7}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}-r${VERSION_CODE}.${SHA7}" >> $GITHUB_OUTPUT

      - name: Build arm64 release APK
        env:
          TERMUX_APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          TERMUX_APK_VERSION_TAG: ${{ steps.version.outputs.tag }}-apt-android-7-github-release
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          echo "APK_DIR=app/build/outputs/apk/release" >> $GITHUB_ENV
          ls -la app/build/outputs/apk/release/

      - name: Build arm64 debug APK
        env:
          TERMUX_APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          TERMUX_APK_VERSION_TAG: ${{ steps.version.outputs.tag }}-apt-android-7-github-debug
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --no-daemon
          echo "APK_DIR_DEBUG=app/build/outputs/apk/debug" >> $GITHUB_ENV
          ls -la app/build/outputs/apk/debug/

      - name: Select arm64 APKs
        id: apk
        run: |
          REL=$(find "$APK_DIR" -name "*_arm64-v8a.apk" | head -1)
          DBG=$(find "$APK_DIR_DEBUG" -name "*_arm64-v8a.apk" | head -1)
          [ -z "$REL" ] && { echo "release arm64 APK not found"; ls "$APK_DIR"; exit 1; }
          [ -z "$DBG" ] && { echo "debug arm64 APK not found"; ls "$APK_DIR_DEBUG"; exit 1; }
          echo "release=$REL" >> $GITHUB_OUTPUT
          echo "debug=$DBG" >> $GITHUB_OUTPUT
          echo "release_name=$(basename "$REL")" >> $GITHUB_OUTPUT
          echo "debug_name=$(basename "$DBG")" >> $GITHUB_OUTPUT

      - name: Create pre-release and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --prerelease \
            --title "Termux ${{ steps.version.outputs.name }} (arm64)" \
            --notes "自动构建于 commit ${GITHUB_SHA::7}

          - 基于 termux-app v${{ steps.version.outputs.name }}
          - 仅 arm64-v8a, 包名 com.termux, 官方 pkg 源完全可用
          - **${{ steps.apk.outputs.release_name }}**: release 构建 (R8, 非 debuggable, 省内存)
          - **${{ steps.apk.outputs.debug_name }}**: debug 构建 (debuggable, htop/ps 可见本体进程, 崩溃栈最全)
          - 两包同签名, 可互相覆盖安装, 但不可与官方包共存" \
            "${{ steps.apk.outputs.release }}" \
            "${{ steps.apk.outputs.debug }}"
